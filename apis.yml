- aid: brave:brave-ads-api
  name: Brave Ads API
  description: >
    API for managing and reporting on Brave Ads campaigns. Enables advertisers to retrieve campaign details
    and performance data for privacy-preserving native browser ads and search ads. Supports customizable
    reporting dimensions and metrics including impressions, clicks, spend, and conversion tracking. Authentication
    uses API keys generated from the Brave Ads dashboard.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
